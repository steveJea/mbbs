    * {

      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;

      margin-bottom: 0.3rem;
      line-height: 1.1;

    .main-title span {

      width: 100%;
    }

    .banner {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 200px;
      background: var(--card-bg);
      border: 1.5px solid rgba(255, 40, 40, 0.5);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
    }

    .banner:hover {
      transform: translateY(-5px) scale(1.03);
      border-color: #ff3333;
      box-shadow: 0 10px 28px rgba(255, 26, 26, 0.5);
    }

    .banner img {
      width: 100%;
      height: 160px;
      object-fit: contain;
      background: #111;
      padding: 8px;
      display: block;
    }
