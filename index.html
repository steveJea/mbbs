  <style>
    :root {
      --accent: #ff1a1a;
      --accent-glow: rgba(255, 26, 26, 0.6);
      --bg: #000000;
      --card-bg: rgba(15, 0, 0, 0.9);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: #ffffff;
      font-family: 'Noto Sans KR', system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      min-height: 680px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .video-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .video-wrapper video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.2) 0%,
        rgba(0, 0, 0, 0.35) 40%,
        rgba(0, 0, 0, 0.8) 70%,
        rgba(0, 0, 0, 0.97) 100%
      );
      pointer-events: none;
    }

    .content {
      position: relative;
      z-index: 3;
      margin-top: auto;
      width: 100%;
      padding: 0 1rem 2.8rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .logo {
      width: min(150px, 36vw);
      height: auto;
      margin-bottom: 1rem;
      filter: drop-shadow(0 0 16px var(--accent-glow));
    }

    .main-title {
      font-family: 'Black Han Sans', 'Noto Sans KR', sans-serif;
      font-size: clamp(1.7rem, 6vw, 3.2rem);
      letter-spacing: 0.04em;
      color: #fff;
      text-shadow:
        0 0 28px var(--accent-glow),
        0 0 50px rgba(255, 0, 0, 0.35),
        3px 3px 0 #000;
      margin-bottom: 0.3rem;
      line-height: 1.1;
    }

    .main-title span {
      color: var(--accent);
    }

    .subtitle {
      font-size: clamp(0.9rem, 2.6vw, 1.15rem);
      font-weight: 700;
      color: #ddd;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 1.8rem;
      opacity: 0.9;
    }

    /* ===== 배너 형태 바로가기 ===== */
    .banner-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.9rem;
      max-width: 1100px;
      width: 100%;
    }

    .banner {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 200px;
      background: var(--card-bg);
      border: 1.5px solid rgba(255, 40, 40, 0.5);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: #fff;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.55);
    }

    .banner:hover {
      transform: translateY(-5px) scale(1.03);
      border-color: #ff3333;
      box-shadow: 0 10px 28px rgba(255, 26, 26, 0.5);
    }

    .banner img {
      width: 100%;
      height: 160px;
      object-fit: contain;
      background: #111;
      padding: 8px;
      display: block;
    }

    .banner .banner-text {
      padding: 0.7rem 0.5rem 0.85rem;
      width: 100%;
      background: rgba(0, 0, 0, 0.7);
    }

    .banner .label {
      font-size: 0.95rem;
      font-weight: 700;
      line-height: 1.25;
    }

    .banner .platform {
      font-size: 0.7rem;
      opacity: 0.75;
      margin-top: 0.2rem;
      font-weight: 400;
    }

    /* 모바일 */
    @media (max-width: 700px) {
      .banner {
        width: calc(50% - 0.5rem);
        max-width: 180px;
      }
      .banner img {
        height: 140px;
      }
      .content {
        padding-bottom: 2.2rem;
      }
    }

    @media (max-width: 400px) {
      .banner {
        width: 100%;
        max-width: 260px;
      }
    }
  </style>
</head>
